name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Minimal permissions: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for secrets (gitleaks)
        shell: pwsh
        run: |
          $version = "8.30.1"
          $zip = "gitleaks_${version}_windows_x64.zip"
          $url = "https://github.com/gitleaks/gitleaks/releases/download/v$version/$zip"
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $zip
          $expected = "d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e"
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "gitleaks download checksum mismatch" }
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\gitleaks"
          & "$env:RUNNER_TEMP\gitleaks\gitleaks.exe" git --redact --no-banner

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend (type-check + bundle)
        run: npm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Lint (clippy)
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build backend
        working-directory: src-tauri
        run: cargo build --locked
