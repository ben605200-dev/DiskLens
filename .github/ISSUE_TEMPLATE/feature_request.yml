name: Feature request
description: Suggest an idea or improvement for DiskLens.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        DiskLens stays 100% local by design - features that need network
        calls, accounts, or telemetry cannot be accepted.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation or annoyance you have, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like DiskLens to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
    validations:
      required: false
